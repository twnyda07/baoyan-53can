<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>善財五十三參．寄送名單（工作人員）</title>
<style>
  :root{
    --navy:#0a0e24; --navy2:#131a40;
    --gold:#d4af37; --gold-light:#f3e0a3; --gold-deep:#9c7a1e;
    --ink:#ede6cf; --ink-soft:#b9b08f;
    --panel:rgba(18,24,58,.82); --panel-line:rgba(212,175,55,.45);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:"Noto Serif TC","Songti TC","STSong","PMingLiU",serif;
    color:var(--ink); min-height:100vh; padding:26px 16px 60px;
    background:radial-gradient(ellipse at 50% -10%, #28306e 0%, var(--navy2) 34%, var(--navy) 72%, #05070f 100%) fixed;
  }
  .wrap{max-width:1100px; margin:0 auto;}
  header{text-align:center; margin-bottom:22px;}
  .temple{color:var(--gold-light); letter-spacing:.5em; font-size:15px; text-indent:.5em;}
  h1{color:#fff; font-size:27px; margin-top:10px; line-height:1.5;}
  h1 span{background:linear-gradient(90deg,#f3e0a3,#d4af37 50%,#f3e0a3);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .sub{color:var(--ink-soft); font-size:15px; margin-top:10px; line-height:1.8;}

  .card{background:var(--panel); border:1.5px solid var(--panel-line); border-radius:16px;
    box-shadow:0 16px 40px rgba(0,0,0,.5); padding:24px 22px;}

  /* 密碼關卡 */
  .gate{max-width:420px; margin:26px auto 0; text-align:center;}
  .gate h2{font-size:16px; color:var(--gold); letter-spacing:.28em; margin-bottom:16px; font-weight:700;}
  .gate input{width:100%; font-family:inherit; font-size:19px; text-align:center; letter-spacing:.14em;
    color:var(--ink); background:rgba(8,12,30,.62); border:1px solid rgba(212,175,55,.45);
    border-radius:10px; padding:14px 16px; outline:none;}
  .gate input:focus{border-color:var(--gold); box-shadow:0 0 0 2px rgba(212,175,55,.18);}
  .btn{appearance:none; border:1.5px solid #fff2cf; cursor:pointer; font-family:inherit;
    background:linear-gradient(180deg,#f3e0a3,#d4af37 55%,#9c7a1e); color:#3a2a05;
    font-weight:700; font-size:17px; letter-spacing:.2em; text-indent:.2em;
    padding:13px 34px; border-radius:40px; margin-top:16px;
    box-shadow:0 6px 18px rgba(0,0,0,.4), inset 0 1px 0 #fff6d8; transition:transform .15s;}
  .btn:hover{transform:translateY(-2px);} .btn:active{transform:translateY(1px);}
  .btn[disabled]{opacity:.55; cursor:default; transform:none;}
  .btn.small{font-size:14.5px; padding:10px 20px; letter-spacing:.1em; text-indent:.1em; margin-top:0;}
  .btn.ghost{background:transparent; color:var(--gold-light); border:1.5px solid var(--gold); box-shadow:none;}
  .btn.ghost:hover{background:rgba(212,175,55,.14);}
  .msg{min-height:22px; margin-top:12px; font-size:15px; line-height:1.7;}
  .msg.bad{color:#ffd9a8;} .msg.ok{color:#bff0c8;}

  /* 名單區 */
  #board{display:none;}
  .stats{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:18px;}
  .stat{background:rgba(8,12,30,.55); border:1px solid rgba(212,175,55,.28); border-radius:12px;
    padding:14px 8px; text-align:center;}
  .stat .v{font-size:27px; font-weight:700; color:var(--gold-light); text-shadow:0 0 12px rgba(212,175,55,.3);}
  .stat .k{font-size:13.5px; color:var(--ink-soft); letter-spacing:.1em; margin-top:4px;}

  .tools{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .tools input[type=search]{flex:1; min-width:200px; font-family:inherit; font-size:16px; color:var(--ink);
    background:rgba(8,12,30,.62); border:1px solid rgba(212,175,55,.4); border-radius:10px; padding:11px 14px; outline:none;}
  .tools input[type=search]:focus{border-color:var(--gold);}

  .tablewrap{overflow-x:auto; border:1px solid rgba(212,175,55,.25); border-radius:12px;}
  table{width:100%; border-collapse:collapse; font-size:15.5px; min-width:760px;}
  thead th{position:sticky; top:0; background:#1a2250; color:var(--gold-light); font-weight:700;
    text-align:left; padding:12px 12px; letter-spacing:.06em; border-bottom:1px solid rgba(212,175,55,.35); white-space:nowrap;}
  tbody td{padding:11px 12px; border-bottom:1px solid rgba(212,175,55,.14); line-height:1.6; vertical-align:top;}
  tbody tr:nth-child(even){background:rgba(8,12,30,.35);}
  tbody tr:hover{background:rgba(212,175,55,.09);}
  td.email{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:14.5px; color:var(--gold-light); word-break:break-all;}
  td.nm{font-weight:700;}
  .tag{display:inline-block; font-size:13px; padding:3px 11px; border-radius:20px; white-space:nowrap;
    border:1px solid rgba(212,175,55,.5); color:var(--gold-light); background:rgba(212,175,55,.12);}
  .tag.face{border-color:rgba(150,170,255,.55); color:#cfd8ff; background:rgba(120,140,210,.16);}
  .foot{margin-top:14px; color:var(--ink-soft); font-size:13.5px; line-height:1.85; text-align:center;}
  .foot a{color:var(--gold-light);}
  @media(max-width:700px){
    h1{font-size:22px;}
    .stats{grid-template-columns:repeat(2,1fr);}
    .card{padding:18px 14px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="temple">寶 嚴 禪 寺</div>
    <h1><span>善財五十三參．寄送名單</span></h1>
    <p class="sub">工作人員專用 · 抽籤／面相觀照留下 Email 的名單</p>
  </header>

  <!-- 密碼關卡 -->
  <div class="card gate" id="gate">
    <h2>請 輸 入 密 碼</h2>
    <input type="password" id="pw" placeholder="共同密碼" autocomplete="current-password" inputmode="text">
    <br><button class="btn" id="goBtn">進　入</button>
    <div class="msg" id="gmsg"></div>
  </div>

  <!-- 名單 -->
  <div class="card" id="board">
    <div class="stats">
      <div class="stat"><div class="v" id="s-all">0</div><div class="k">總筆數</div></div>
      <div class="stat"><div class="v" id="s-mail">0</div><div class="k">不重複信箱</div></div>
      <div class="stat"><div class="v" id="s-draw">0</div><div class="k">抽籤</div></div>
      <div class="stat"><div class="v" id="s-face">0</div><div class="k">面相觀照</div></div>
      <div class="stat"><div class="v" id="s-today">0</div><div class="k">今天</div></div>
    </div>

    <div class="tools">
      <input type="search" id="q" placeholder="搜尋姓名、Email、善知識、菩薩…">
      <button class="btn small ghost" id="copyBtn">複製全部 Email</button>
      <button class="btn small ghost" id="csvBtn">下載 CSV</button>
      <button class="btn small ghost" id="reloadBtn">重新整理</button>
    </div>

    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>時間</th><th>姓名</th><th>Email</th><th>類型</th><th>第幾參</th>
          <th>善知識</th><th>有緣菩薩</th><th>三分數</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div class="msg" id="bmsg"></div>
    <div class="foot">
      顯示 <b id="f-shown">0</b> 筆　·　資料來源：<a id="ssLink" href="#" target="_blank" rel="noopener">Google 試算表</a><br>
      名單僅供寶嚴禪寺寄送與法訊聯絡之用，請勿外流。
    </div>
  </div>
</div>

<script src="mailer.js"></script>
<script>
/* 後端網址沿用 mailer.js 的 MAIL_API；密碼一律送到後端驗，前端不存明碼名單 */
const gate=document.getElementById("gate"), board=document.getElementById("board"),
      pwEl=document.getElementById("pw"), goBtn=document.getElementById("goBtn"),
      gmsg=document.getElementById("gmsg"), bmsg=document.getElementById("bmsg"),
      tb=document.getElementById("tb"), q=document.getElementById("q");
let DATA=[], PW="";

function say(el,t,c){ el.textContent=t; el.className="msg "+(c||""); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m])); }

/* Apps Script 的轉址偶爾會讓 fetch 失敗（跨網域），所以重試最多 3 次；
   讀名單是唯讀動作，重試不會有副作用。 */
async function fetchList(pw){
  let lastErr=null;
  for(let i=0;i<3;i++){
    if(i) await new Promise(r=>setTimeout(r, 900*i));
    try{
      const res = await fetch(MAIL_API, {
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify({action:"list", pw:pw}),
        redirect:"follow"
      });
      return JSON.parse(await res.text());
    }catch(e){ lastErr=e; }
  }
  throw lastErr;
}

async function enter(){
  const pw=pwEl.value.trim();
  if(!pw){ say(gmsg,"請輸入密碼。","bad"); pwEl.focus(); return; }
  goBtn.disabled=true; const lb=goBtn.textContent; goBtn.textContent="讀取中…";
  say(gmsg,"正在讀取名單…","");
  try{
    const r=await fetchList(pw);
    if(!r.ok){ say(gmsg, r.msg||"讀取失敗。","bad"); return; }
    PW=pw; sessionStorage.setItem("baoyan53_admin", pw);
    DATA=r.rows||[];
    document.getElementById("ssLink").href=r.sheetUrl||"#";
    gate.style.display="none"; board.style.display="block";
    render(); say(gmsg,"","");
  }catch(e){
    say(gmsg,"連線失敗，請確認網路後再試。","bad");
  }finally{
    goBtn.disabled=false; goBtn.textContent=lb;
  }
}

async function reload(){
  say(bmsg,"重新讀取中…","");
  try{
    const r=await fetchList(PW);
    if(!r.ok){ say(bmsg, r.msg||"讀取失敗。","bad"); return; }
    DATA=r.rows||[]; render(); say(bmsg,"已更新。","ok");
    setTimeout(()=>say(bmsg,"",""),2500);
  }catch(e){ say(bmsg,"連線失敗。","bad"); }
}

function filtered(){
  const k=q.value.trim().toLowerCase();
  if(!k) return DATA;
  return DATA.filter(r=>r.join(" ").toLowerCase().indexOf(k)>=0);
}

function render(){
  const rows=filtered();
  const today=new Date().toISOString().slice(0,10);
  const mails=new Set(DATA.map(r=>(r[2]||"").toLowerCase()).filter(Boolean));
  document.getElementById("s-all").textContent=DATA.length;
  document.getElementById("s-mail").textContent=mails.size;
  document.getElementById("s-draw").textContent=DATA.filter(r=>r[3]==="抽籤").length;
  document.getElementById("s-face").textContent=DATA.filter(r=>r[3]==="面相觀照").length;
  document.getElementById("s-today").textContent=DATA.filter(r=>(r[0]||"").slice(0,10)===today).length;
  document.getElementById("f-shown").textContent=rows.length;

  tb.innerHTML=rows.map(r=>`<tr>
    <td>${esc(r[0])}</td>
    <td class="nm">${esc(r[1])}</td>
    <td class="email">${esc(r[2])}</td>
    <td><span class="tag${r[3]==="面相觀照"?" face":""}">${esc(r[3])}</span></td>
    <td>${esc(r[4])}</td>
    <td>${esc(r[5])}</td>
    <td>${esc(r[6])}</td>
    <td>${esc(r[7])}</td></tr>`).join("")
    || `<tr><td colspan="8" style="text-align:center;padding:26px;color:var(--ink-soft)">目前沒有符合的資料</td></tr>`;
}

function copyMails(){
  const list=[...new Set(filtered().map(r=>r[2]).filter(Boolean))];
  navigator.clipboard.writeText(list.join(", ")).then(
    ()=>{ say(bmsg,`已複製 ${list.length} 個不重複 Email，可直接貼到收件人欄（建議用密件副本 BCC）。`,"ok"); },
    ()=>{ say(bmsg,"瀏覽器不允許複製，請改用「下載 CSV」。","bad"); });
}

function downloadCSV(){
  const rows=filtered();
  const head=["時間","姓名","Email","類型","第幾參","善知識","有緣菩薩","三分數(智/業/福)"];
  const cell=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const csv=[head.map(cell).join(",")].concat(rows.map(r=>r.slice(0,8).map(cell).join(","))).join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});   // BOM 讓 Excel 不亂碼
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="善財五十三參_寄送名單_"+new Date().toISOString().slice(0,10)+".csv";
  a.click(); URL.revokeObjectURL(a.href);
  say(bmsg,`已下載 ${rows.length} 筆。`,"ok");
}

goBtn.addEventListener("click", enter);
pwEl.addEventListener("keydown", e=>{ if(e.key==="Enter") enter(); });
q.addEventListener("input", render);
document.getElementById("copyBtn").addEventListener("click", copyMails);
document.getElementById("csvBtn").addEventListener("click", downloadCSV);
document.getElementById("reloadBtn").addEventListener("click", reload);

/* 同一分頁內回來不必重打密碼（關閉分頁就失效） */
(function(){
  const saved=sessionStorage.getItem("baoyan53_admin");
  if(saved){ pwEl.value=saved; enter(); }
})();
</script>
</body>
</html>
